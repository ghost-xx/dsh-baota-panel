# The single row this bundle inserts. `config` is read by lib/index.js at apply
# time; 设置 → 宝塔面板 writes the panel list and the sidebar switch through the
# Host configEditor (never by hand-editing this file).
#
# Several panels are supported: `panels` is a list, each with its own address and
# API key, and every tool takes an optional `panel` argument (id or name).
- insert:
    - id: dsh-baota-panel
      name: dsh-baota-panel
      config:
        panels: []
        activePanel: ''
        showInSidebar: true
        requestTimeoutMs: 20000
